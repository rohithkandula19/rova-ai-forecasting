name: ROVA — CI/CD GCP Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION:     us-central1
  REGISTRY:   gcr.io

jobs:
  # ──────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     rova_user
          POSTGRES_PASSWORD: rova_pass
          POSTGRES_DB:       rova_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://rova_user:rova_pass@localhost/rova_test
          SECRET_KEY:   ci-secret-key-not-used-in-prod
          REDIS_URL:    redis://localhost:6379/0
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://rova_user:rova_pass@localhost/rova_test
          SECRET_KEY:   ci-secret-key-not-used-in-prod
          REDIS_URL:    redis://localhost:6379/0
        run: python -m pytest tests/ -v --tb=short -x

  # ──────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Set image tag
        run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build & push API
        run: |
          docker build \
            -t $REGISTRY/$PROJECT_ID/rova-api:$SHA \
            -t $REGISTRY/$PROJECT_ID/rova-api:latest \
            ./backend
          docker push $REGISTRY/$PROJECT_ID/rova-api:$SHA
          docker push $REGISTRY/$PROJECT_ID/rova-api:latest

      - name: Build & push Frontend
        run: |
          docker build \
            -t $REGISTRY/$PROJECT_ID/rova-frontend:$SHA \
            -t $REGISTRY/$PROJECT_ID/rova-frontend:latest \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --build-arg VITE_WS_URL=${{ secrets.VITE_WS_URL }} \
            ./frontend
          docker push $REGISTRY/$PROJECT_ID/rova-frontend:$SHA
          docker push $REGISTRY/$PROJECT_ID/rova-frontend:latest

  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GCP Cloud Run
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set image tag
        run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Run DB migrations
        run: |
          gcloud run jobs create rova-migrate-$SHA \
            --image=$REGISTRY/$PROJECT_ID/rova-api:$SHA \
            --command=alembic \
            --args=upgrade,head \
            --set-secrets=DATABASE_URL=rova-database-url:latest \
            --region=$REGION \
            --execute-now \
            --wait || echo "Migration job already exists — skipping"

      - name: Deploy API
        run: |
          gcloud run deploy rova-api \
            --image=$REGISTRY/$PROJECT_ID/rova-api:$SHA \
            --region=$REGION \
            --platform=managed \
            --min-instances=1 \
            --max-instances=10 \
            --memory=2Gi \
            --cpu=2 \
            --concurrency=100 \
            --timeout=60 \
            --set-secrets="DATABASE_URL=rova-database-url:latest,SECRET_KEY=rova-secret-key:latest" \
            --set-env-vars="ENVIRONMENT=production,GCP_PROJECT_ID=$PROJECT_ID" \
            --allow-unauthenticated

      - name: Deploy Frontend
        run: |
          gcloud run deploy rova-frontend \
            --image=$REGISTRY/$PROJECT_ID/rova-frontend:$SHA \
            --region=$REGION \
            --platform=managed \
            --min-instances=1 \
            --max-instances=5 \
            --memory=512Mi \
            --cpu=1 \
            --allow-unauthenticated

      - name: Print URLs
        run: |
          echo "API:      $(gcloud run services describe rova-api      --region=$REGION --format='value(status.url)')"
          echo "Frontend: $(gcloud run services describe rova-frontend --region=$REGION --format='value(status.url)')"

      - name: Slack — success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: '{"text":"✅ ROVA deployed — SHA ${{ env.SHA }} — $(gcloud run services describe rova-frontend --region=${{ env.REGION }} --format=value(status.url))"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Slack — failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: '{"text":"❌ ROVA deploy FAILED — SHA ${{ env.SHA }} — check GitHub Actions"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
